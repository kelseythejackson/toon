<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · Straight ahead vs pose to pose in CSS — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<style>
  body { font-size: 15px; line-height: 1.5; max-width: var(--demo-max-width); margin: 2rem auto; padding: 0 1rem; }
  .row { background: var(--demo-surface); border-radius: var(--demo-radius); border: var(--demo-panel-border);
    box-shadow: var(--demo-panel-shadow); padding: 1.25rem 1.25rem 1rem; }
  .row > div:not(.labels) { justify-content: center; border-bottom: 2px solid var(--demo-ground-line); }
  .labels { display: flex; justify-content: center; gap: 40px; margin-top: .5rem; }
  .labels small { width: 96px; text-align: center; }
  /* Flat fills with an ink outline, like the cast. */
  .body, .wave { border: 2.5px solid var(--demo-ink); box-sizing: border-box; }
  /* Reduced motion: the demo's Play button lets the arm move again. */
  [data-motion="play"] .wave { animation-play-state: running; }

/* @recipe */
/* Pose to pose: you write the key poses, the browser
   draws the in-betweens. 0deg is the arm hanging down. */
@keyframes wave {
  0%, 100% { rotate: -20deg; }              /* rest */
  15%      { rotate: -8deg;                 /* wind-up */
             animation-timing-function:
               var(--toon-ease-overshoot); }
  45%, 75% { rotate: -150deg; }             /* arm up */
  60%      { rotate: -115deg; }             /* wave */
}
.wave { transform-origin: 50% 5px;
  animation: wave 3s var(--toon-ease-in-out) infinite; }
@media (prefers-reduced-motion: reduce) {
  /* Hold the arm-up pose instead of moving. */
  .wave { animation-play-state: paused; animation-delay: -1.5s; }
}
/* @end */
</style>
</head>
<body>
<h1>Straight ahead vs pose to pose in CSS</h1>
<p>A flame drawn frame by frame and played as a flipbook, next to an arm that moves between key poses.</p>
<div class="row" role="img" aria-label="On the left a flame flickers, drawn as eight separate frames. On the right a ball raises its arm, waves and lowers it again through planned key poses.">
<!-- @recipe -->
<div style="display:flex; gap:40px; align-items:end;
  height:130px">
  <!-- Straight ahead: 8 drawn frames, played in order. -->
  <div class="toon-sprite" id="flame" style="--toon-frames:8;
    --toon-fps:12; --toon-frame-w:64px; height:96px"></div>
  <!-- Pose to pose: a body with a waving arm. -->
  <div class="body" style="position:relative; width:56px;
    height:56px; border-radius:50%;
    background:var(--toon-color)">
    <div class="wave" style="position:absolute; left:42px;
      top:12px; width:10px; height:44px; border-radius:5px;
      background:var(--toon-color)"></div>
  </div>
</div>
<!-- @end -->
<div class="labels"><small>straight ahead</small><small>pose to pose</small></div>
</div>

<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('04-straight-ahead-vs-pose-to-pose-css', (document, Toon, DemoTheme) => {
// @recipe
// Straight ahead: draw 8 flame frames into one sprite sheet,
// each frame grown from the one before. .toon-sprite plays
// them with steps(), so there are no in-betweens.
function drawFlames() {
  const F = 8, W = 64, H = 96;      // frames, frame size (px)
  const sheet = document.createElement('canvas');
  sheet.width = F * W; sheet.height = H;
  const g = sheet.getContext('2d');
  g.fillStyle = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color');
  g.strokeStyle = getComputedStyle(document.body).color;
  g.lineWidth = 2.5;
  let lobes = Array(10).fill(1);   // the size of each lobe
  for (let f = 0; f < F; f++) {
    // Nudge every lobe from where the last frame left it.
    lobes = lobes.map((v) => Math.min(1.3,
      Math.max(0.75, v + Math.random() * 0.4 - 0.2)));
    const pts = lobes.map((v, i) => {
      const a = (i / lobes.length) * Math.PI * 2;
      const up = Math.max(0, -Math.sin(a));  // taller on top
      return { x: f * W + 32 + Math.cos(a) * 16 * v * (1 - up/2),
               y: 70 + Math.sin(a) * 16 * v * (1 + up * 2) };
    });
    g.beginPath();
    pts.forEach((p, i) => {
      const n = pts[(i + 1) % pts.length];
      g.quadraticCurveTo(p.x, p.y,
        (p.x + n.x) / 2, (p.y + n.y) / 2);
    });
    g.closePath(); g.fill(); g.stroke();
  }
  document.getElementById('flame').style.backgroundImage =
    `url(${sheet.toDataURL()})`;
}
drawFlames();
// @end
DemoTheme.onChange(drawFlames);   // redraw in the new colors
});
</script>
</body>
</html>
