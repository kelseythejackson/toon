<p>Appeal is charisma: simple readable shapes, soft curves, and a sense of life. Dot breathes and blinks on an irregular rhythm.</p>

<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="cast-shapes.js"></script>
<script src="cast.js"></script>
<script>
  const T = DemoTheme;                                    // design tokens, live (see demo-theme.js)
  const { createStage, ticker, tween, sequence, ease, breathe, blink, Spring, withSquash, groundShadow, clamp } = Toon;
  const stage = createStage(document.getElementById('c'));
  const { ctx } = stage;
  const dot = { hop: 0, sy: 1 };
  let happy = false, busy = false, mouse = { x: stage.width / 2, y: stage.height / 2 };
  const look = { x: new Spring(0, { stiffness: 140, damping: 16 }), y: new Spring(0, { stiffness: 140, damping: 16 }) };
  const set = v => Object.assign(dot, v);
  const to = (pose, d, e) => () => tween({ from: { ...dot }, to: pose, duration: d, ease: e, onUpdate: set });

  stage.canvas.addEventListener('pointermove', e => { const r = stage.canvas.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; });
  const act = async () => {
    if (busy) return; busy = happy = true;
    await sequence(to({ sy: 0.8 }, 120, ease.outQuad), to({ hop: 60, sy: 1.12 }, 260, ease.outQuad),
                   to({ hop: 0, sy: 1 }, 240, ease.inQuad), to({ sy: 0.82 }, 70, ease.outQuad), to({ sy: 1 }, 450, ease.outElastic));
    busy = false; setTimeout(() => (happy = false), 600);
  };
  stage.canvas.addEventListener('click', act);
  document.getElementById('act').addEventListener('click', act);

  stage.loop((dt, t) => {
    const H = 140, cx = stage.width / 2, ground = stage.height - 40, cy = ground - H / 2 - dot.hop;
    const b = breathe(t, { rate: 0.35, amount: 0.025 });               // [APPEAL] alive at rest
    const shut = happy ? 0 : blink(t, { every: 3 });
    look.x.target = clamp((mouse.x - cx) / 120, -1, 1); look.y.target = clamp((mouse.y - cy) / 120, -1, 1);
    const lx = look.x.step(dt), ly = look.y.step(dt);
    stage.clear();
    groundShadow(ctx, cx, ground, 60, dot.hop, { maxHeight: 200 });
    withSquash(ctx, cx, cy, { sx: b.sx / dot.sy, sy: b.sy * dot.sy }, c =>
      Cast.draw(c, 'dot', { x: 0, y: 0, h: H, fill: T.primary, ink: T.ink, mood: happy ? 'happy' : 'neutral',
        blink: shut, look: { x: lx, y: ly } }), { x: 0, y: H / 2 });
  });

  const pop = document.getElementById('pop');
  document.getElementById('replay').onclick = () => { pop.classList.remove('toon-pop-in'); void pop.offsetWidth; pop.classList.add('toon-pop-in'); };
</script>
