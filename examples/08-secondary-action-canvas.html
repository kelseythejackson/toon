<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · Secondary action in Canvas — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
</head>
<body>
<h1>Secondary action in Canvas</h1>
<p>A character walks in place. The arms swing from the walk's own phase, the eyes glance around with
  <code>noise</code> and the lids close now and then with <code>blink</code>.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:180px" role="img"
  aria-label="A round character walks in place. Its arms
  swing against its steps, its eyes glance around and it
  blinks now and then"></canvas>
<label><input id="extras" type="checkbox" checked>
  Secondary action</label>
<!-- @end -->
</div>
<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('08-secondary-action-canvas', (document, Toon, DemoTheme) => {
// @recipe
const { createStage, noise, blink } = Toon;
const stage = createStage(document.querySelector('canvas'));
const extras = document.getElementById('extras');
const r = 34, steps = 1.6;   // body radius px, steps per second
// Start mid-stride, eyes to one side.
let t = 0.15;
// @fold
// Reduced motion: freeze the clock on that frame.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Toon.ticker.timeScale = 0;
}
// @end-fold

stage.loop((dt) => {
  t += dt;
  const on = extras.checked;
  const phase = t * Math.PI * 2 * steps;
  // Primary action: the walk. Feet alternate, body bobs.
  const bob = Math.abs(Math.sin(phase)) * 6;
  // Secondary, driven by the walk: arms swing against it.
  const swing = on ? Math.sin(phase) : 0;
  // Secondary, on their own clocks: glances and blinks.
  const look = on ? noise(t * 0.6) * 6 : 0;       // px
  const shut = on ? blink(t, { every: 2.8 }) : 0; // 0 to 1

  const ctx = stage.ctx, x = stage.width / 2;
  const floor = stage.height - 24, y = floor - 16 - r - bob;
  // @fold
  const fill = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color').trim() || '#ff6b4a';
  const ink = getComputedStyle(document.body).color;
  // @end-fold
  stage.clear();
  ctx.fillStyle = ink; ctx.fillRect(0, floor, stage.width, 2);
  ctx.strokeStyle = ink; ctx.fillStyle = ink;
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    // Feet take turns lifting: the walk, marching in place.
    const lift = Math.max(0, Math.sin(phase) * side) * 8;
    ctx.beginPath();
    ctx.ellipse(x + side * 13, floor - 5 - lift, 10, 5,
      0, 0, Math.PI * 2);
    ctx.fill();
    // Each arm swings out as the opposite foot lifts.
    const a = 0.35 + Math.max(0, -swing * side) * 1.4;
    const sx = x + side * r * 0.85, sy = y + 6;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + side * Math.sin(a) * 26,
      sy + Math.cos(a) * 26);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  ctx.fillStyle = ink;
  for (const side of [-1, 1]) {   // eyes squash to a line
    ctx.beginPath();
    ctx.ellipse(x + side * 11 + look, y - 6, 4,
      Math.max(0.8, 7 * (1 - shut)), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();                // mouth
  ctx.arc(x + look, y + 8, 7, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
});
// @end
});
</script>
</body>
</html>
