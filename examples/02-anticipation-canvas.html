<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Anticipation in Canvas — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
</head>
<body>
<h1>Anticipation in Canvas</h1>
<p>A ball that crouches before every jump, scripted as beats with <code>sequence</code> and <code>tween</code>.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:180px" role="img"
  aria-label="A ball crouches low, then springs up into a
  jump, lands with a squash and settles, over and over"></canvas>
<!-- @end -->
</div>
<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('02-anticipation-canvas', (document, Toon, DemoTheme) => {
// @recipe
const { createStage, tween, wait, sequence, ease, withSquash,
        groundShadow } = Toon;
const stage = createStage(document.querySelector('canvas'));
const r = 24;                    // px
// y: height above the floor (px). sy: vertical scale; the
// width scale is 1 / sy, so the ball keeps its volume.
// Start crouched: the pose that shows the principle.
const ball = { y: 0, sy: 0.62 };
const to = (pose, ms, e) => () => tween({
  from: { ...ball }, to: pose, duration: ms, ease: e,
  onUpdate: (v) => Object.assign(ball, v),
});
// @fold
// Reduced motion: freeze the clock, so the ball holds its crouch.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Toon.ticker.timeScale = 0;
}
// @end-fold

async function jump() {
  await sequence(
    to({ y: 0, sy: 0.62 }, 280, ease.outQuad),  // crouch
    to({ y: 20, sy: 1.3 }, 90, ease.linear),    // take off
    to({ y: 90, sy: 1 }, 300, ease.outQuad),    // rise
    to({ y: 0, sy: 1.15 }, 280, ease.inQuad),   // fall
    to({ y: 0, sy: 0.75 }, 70, ease.outQuad),   // land
    to({ y: 0, sy: 1 }, 400, ease.outElastic),  // settle
    () => wait(500),
  );
  jump();
}
jump();

stage.loop(() => {
  const ctx = stage.ctx, x = stage.width / 2;
  const floor = stage.height - 24;
  // @fold
  // Colors from the page: --toon-color fill, text color for ink.
  const fill = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color').trim() || '#ff6b4a';
  const ink = getComputedStyle(document.body).color;
  // @end-fold
  stage.clear();
  ctx.fillStyle = ink; ctx.fillRect(0, floor, stage.width, 2);
  groundShadow(ctx, x, floor, r, ball.y);
  const s = { sx: 1 / ball.sy, sy: ball.sy };
  // Scale from the base, so the crouch stays on the floor.
  withSquash(ctx, x, floor - r - ball.y, s, (c) => {
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2);
    c.fillStyle = fill; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = ink; c.stroke();
  }, { x: 0, y: r });
});
// @end
});
</script>
</body>
</html>
