<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · Straight ahead vs pose to pose — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<style>
  body { font-size: 15px; line-height: 1.5; max-width: var(--demo-max-width); margin: 2rem auto; padding: 0 1rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  canvas { display: block; width: 100%; height: 300px; }
  .pair h2 { font-size: 1.17em; }   /* the two columns' labels: real h2s (no skipped level), sized as subheads */
</style>
</head>
<body>
<h1>Straight ahead vs pose to pose</h1>
<div class="pair">
  <div><h2>Straight ahead</h2><canvas id="sa" role="img" aria-label="Smoke drawn straight ahead: each puff grows from the frame before it, so the smoke drifts and curls unpredictably."></canvas>
    <p>Smoke drawn frame after frame at 24 fps: each frame grows out of the previous one. Spontaneous, fluid, hard to plan.</p></div>
  <div><h2>Pose to pose</h2><canvas id="pp" role="img" aria-label="Loop raises an arm through planned key poses, shown as faint ghost frames, with the frames in between filled in."></canvas>
    <p>Loop's wave, built from 5 key poses (ghosted). <code>poses()</code> draws every in-between. Planned, precise, easy to retime.</p></div>
</div>

<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="cast-shapes.js"></script>
<script src="cast.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('04-straight-ahead-vs-pose-to-pose', (document, Toon, DemoTheme) => {
  const T = DemoTheme;                                    // design tokens, live (see demo-theme.js)
  const { createStage, ticker, straightAhead, poses, ease, noise } = Toon;

  /* [STRAIGHT-AHEAD] smoke: state integrates forward one frame at a time */
  const sa = createStage(document.getElementById('sa'));
  const puffs = [];
  const smoke = (h) => {
    if (!sa.visible) return;                           // frozen while scrolled away
    puffs.push({ x: sa.width / 2 + (Math.random() - 0.5) * 12, y: sa.height - 24, vx: 0, vy: -70, r: 6, life: 0, seed: Math.random() * 99 });
    for (const p of puffs) {
      p.vx += noise(p.seed + p.life * 1.5) * 120 * h;   // turbulence depends on where it already is
      p.x += p.vx * h; p.y += p.vy * h; p.r += 14 * h; p.life += h;
    }
    while (puffs.length && puffs[0].life > 3.2) puffs.shift();
    sa.clear();
    for (const p of puffs) {
      sa.ctx.fillStyle = T.alpha(T.muted, 0.2 * (1 - p.life / 3.2));
      sa.ctx.beginPath(); sa.ctx.arc(p.x, p.y, p.r, 0, 7); sa.ctx.fill();
    }
  };
  for (let i = 0; i < 48; i++) smoke(1 / 24);          // 2 s of smoke already drawn, so a paused frame shows it
  straightAhead(smoke, { fps: 24 });

  /* [POSE-TO-POSE] arm: shoulder angle a, elbow bend b (degrees, 0 = hanging down) */
  const pp = createStage(document.getElementById('pp'));
  const keys = [
    { at: 0,    pose: { a: 15,  b: 10 } },                          // rest
    { at: 0.15, pose: { a: 5,   b: 35 } },                          // anticipation dip
    { at: 0.4,  pose: { a: 150, b: 30 }, ease: ease.outBack },      // arm up (overshoots)
    { at: 0.55, pose: { a: 155, b: -30 } },                         // wave
    { at: 0.7,  pose: { a: 150, b: 30 } },
    { at: 0.85, pose: { a: 155, b: -30 } },
    { at: 1,    pose: { a: 15,  b: 10 } },                          // back to rest
  ];
  let arm = keys[0].pose;
  poses(keys, { duration: 3000, repeat: Infinity, onUpdate: p => (arm = p) });

  pp.loop(() => {
    const ctx = pp.ctx, at = { x: pp.width / 2 - 14, y: pp.height / 2 + 18, h: 170 };
    pp.clear();
    for (const k of new Set(keys.map(k => k.pose)))                                     // the key poses, ghosted
      Cast.draw(ctx, 'loop', { ...at, only: 'arms', arms: { r: k }, ink: T.alpha(T.secondary, .3), bg: T.surface });
    const waving = arm.a > 100;                                                          // happy while the arm is up
    Cast.draw(ctx, 'loop', { ...at, fill: T.secondary, ink: T.ink, bg: T.surface, arms: { r: arm },
      mood: waving ? 'happy' : 'neutral', noWink: true, look: { x: 0.7, y: -0.4 } });   // the live in-between
  });
});
</script>
</body>
</html>
