<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · Solid drawing in Canvas — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
</head>
<body>
<h1>Solid drawing in Canvas</h1>
<p>A box and a ball lit from the same side, using <code>shade</code>, <code>drawSolid</code> and
  <code>groundShadow</code>.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:180px" role="img"
  aria-label="A shaded box sits on the floor next to a shaded
  ball that bounces. Both are lit from the top left, and the
  ball's shadow shrinks and fades as it rises"></canvas>
<!-- @end -->
</div>
<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('11-solid-drawing-canvas', (document, Toon, DemoTheme) => {
// @recipe
const { createStage, drawSolid, groundShadow, shade } = Toon;
const stage = createStage(document.querySelector('canvas'));
const r = 28, H = 90, BEAT = 1.1;   // px, px, seconds per bounce
const light = { x: -0.45, y: -0.55 };   // up and to the left
// @fold
// Reduced motion: freeze the clock; the ball rests on the floor.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Toon.ticker.timeScale = 0;
}
// @end-fold

// A box under the same light: the top faces it (lighter), the
// right side turns away (darker). x: left edge, y: the floor.
function box(ctx, x, y, s, color) {
  const d = s * 0.35;              // depth, drawn up and right
  const face = (fill, ...pts) => {
    ctx.beginPath();
    for (const [px, py] of pts) ctx.lineTo(px, py);
    ctx.fillStyle = fill; ctx.fill();
  };
  face(color, [x, y], [x + s, y], [x + s, y - s], [x, y - s]);
  face(shade(color, 0.35), [x, y - s], [x + s, y - s],
    [x + s + d, y - s - d], [x + d, y - s - d]);
  face(shade(color, -0.35), [x + s, y], [x + s + d, y - d],
    [x + s + d, y - s - d], [x + s, y - s]);
}

stage.loop((dt, t) => {
  const ctx = stage.ctx, x = stage.width / 2;
  const floor = stage.height - 24;
  // @fold
  // Colors from the page: --toon-color for shapes, text for ink.
  const color = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color').trim() || '#ff6b4a';
  const ink = getComputedStyle(document.body).color;
  // @end-fold
  // Height above the floor: a parabola, one bounce per BEAT.
  const p = (t / BEAT) % 1, h = 4 * p * (1 - p) * H;

  stage.clear();
  ctx.fillStyle = ink; ctx.fillRect(0, floor, stage.width, 2);
  groundShadow(ctx, x - 46, floor, 34, 0);   // under the box
  box(ctx, x - 80, floor, 56, color);
  groundShadow(ctx, x + 60, floor, r, h, { maxHeight: H * 2 });
  const y = floor - r - h;                    // ball center
  drawSolid(ctx, { x: x + 60, y, r, color, light });
});
// @end
});
</script>
</body>
</html>
