<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting started · Your first Canvas animation — toon</title>
<link rel="stylesheet" href="../../src/toon.css">
<link rel="stylesheet" href="../demo.css">
<link rel="stylesheet" href="../recipes/recipe.css">
</head>
<body>
<h1>Your first Canvas animation</h1>
<p>A ball thrown back and forth along an arc, stretching along its direction of travel.</p>
<div class="panel">
<!-- @recipe -->
<canvas id="c" style="width:100%; height:300px" role="img"
        aria-label="A ball is thrown back and forth along an arc"></canvas>
<!-- @end -->
</div>
<script src="../../src/toon.js"></script>
<script src="../demo-theme.js"></script>
<script>
// @recipe
const { createStage, tween, arc, ease, squash, withSquash, drawSolid } = Toon;
const stage = createStage(document.getElementById('c'));
const fly = arc({ x: 40, y: 260 }, { x: 400, y: 260 }, { height: 160 });

let t = 0;
tween({ duration: 1000, ease: ease.linear, repeat: Infinity, yoyo: true,
        onUpdate: (v) => (t = v) });

let last = fly(0);
stage.loop((dt) => {     // like ticker.add, but pauses while off screen
  stage.clear();
  const p = fly(t);
  // velocity in px/s → stretch along the direction of travel
  const s = squash((p.x - last.x) / (dt || 1), (p.y - last.y) / (dt || 1),
                    { amount: 0.0005 });
  last = p;
  withSquash(stage.ctx, p.x, p.y, s, (c) => drawSolid(c, { r: 20 }));
});
// @end
</script>
</body>
</html>
