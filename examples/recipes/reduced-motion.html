<!doctype html>
<html lang="en" data-motion-control="page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe · Respect reduced motion on canvas — toon</title>
<link rel="stylesheet" href="../../src/toon.css">
<link rel="stylesheet" href="../demo.css">
<link rel="stylesheet" href="recipe.css">
</head>
<body>
<h1>Respect reduced motion on canvas</h1>
<p class="demo-hint">The clock follows the reader's reduced-motion setting. The checkbox starts at your system setting: tick it to see the frozen clock, untick it to play anyway.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:300px" role="img"
        aria-label="A ball bobs up and down; it stops when motion is reduced"></canvas>
<label>
  <input type="checkbox" id="pretend"> Reduce motion
</label>
<p class="note" id="status"></p>
<!-- @end -->
</div>
<script src="../../src/toon.js"></script>
<script src="../demo-theme.js"></script>
<script src="../demo-runtime.js"></script>
<script>
ToonDemos.register('recipes/reduced-motion', (document, Toon, DemoTheme) => {
// @recipe
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const pretend = document.querySelector('#pretend');
const apply = () => {
  const on = pretend.checked;           // starts at the system setting
  Toon.ticker.timeScale = on ? 0 : 1;   // 0 freezes the clock
  const pref = reduce.matches ? 'reduced motion' : 'no preference';
  document.querySelector('#status').textContent =
    `Your system setting: ${pref}. The clock is ${on ? 'frozen' : 'running'}.`;
};
const follow = () => { pretend.checked = reduce.matches; apply(); };
follow();
reduce.addEventListener('change', follow);
pretend.addEventListener('change', apply);

// Something decorative to freeze: a ball bobbing on the clock.
const stage = Toon.createStage(document.querySelector('canvas'));
stage.loop((dt, time) => {
  stage.clear();
  const y = stage.height / 2 + Math.sin(time * 3) * 60;
  Toon.drawSolid(stage.ctx, { x: stage.width / 2, y, r: 26 });
});
// @end
});
</script>
</body>
</html>
