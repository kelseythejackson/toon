<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · Secondary action — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<style>
  body { font-size: 15px; line-height: 1.5; max-width: var(--demo-max-width); margin: 2rem auto; padding: 0 1rem; }
  canvas { display: block; width: 100%; height: 300px; margin: var(--space-sm) 0; }
</style>
</head>
<body>
<h1>Secondary action</h1>
<p>The primary action is Loop's walk: the bob and the feet. Secondary actions — swinging arms, idle glances,
  the odd blink — add personality without stealing focus.</p>
<label><input id="sec" type="checkbox" checked> Secondary action</label>
<canvas id="c" role="img" aria-label="Loop walks in place. Its arms swing, its eyes glance around and it blinks now and then. One switch turns all of these secondary actions off, leaving only the walk."></canvas>
<p class="demo-try"><b>Try it</b> Toggle the secondary actions to see how flat the walk gets without them.</p>

<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="cast-shapes.js"></script>
<script src="cast.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('08-secondary-action', (document, Toon, DemoTheme) => {
  const T = DemoTheme;                                    // design tokens, live (see demo-theme.js)
  const { createStage, ticker, noise, blink } = Toon;
  const stage = createStage(document.getElementById('c'));
  const { ctx } = stage;
  const sec = document.getElementById('sec');
  let x = null;                                            // starts mid-stage, so a paused first frame shows the walk

  stage.loop((dt, t) => {
    const ground = stage.height - 40, H = 110, speed = 110;
    if (x === null) x = stage.width * 0.45;
    x += speed * dt; if (x > stage.width + 80) x = -80;
    const phase = t * Math.PI * 2 * 1.6;
    const bob = Math.abs(Math.sin(phase)) * 8;                // primary: walk bounce
    const cy = ground - H / 2 - 12 - bob;

    stage.clear();
    ctx.fillStyle = T.ground; ctx.fillRect(0, ground, stage.width, 40);
    ctx.fillStyle = T.groundLine; ctx.fillRect(0, ground, stage.width, 2);
    for (const side of [0, 1]) {                              // feet, alternating
      const f = Math.sin(phase + side * Math.PI);
      ctx.fillStyle = T.ink; ctx.beginPath();
      ctx.ellipse(x + f * 14, ground - 5 - Math.max(0, -Math.cos(phase + side * Math.PI)) * 8, 11, 5, 0, 0, 7); ctx.fill();
    }
    const on = sec.checked, swing = Math.sin(phase) * 28;
    Cast.draw(ctx, 'loop', { x, y: cy, h: H, fill: T.secondary, ink: T.ink, bg: T.surface, feet: false, noWink: true,
      arms: on ? { r: { a: 15 + swing, b: 25 }, l: { a: 15 - swing, b: 25 } }      // [SECONDARY] arms swing against the legs
               : { r: { a: 8, b: 4 }, l: { a: 8, b: 4 } },
      look: on ? { x: 0.4 + noise(t * 0.6) * 0.8, y: noise(t * 0.4 + 9) * 0.6 } : { x: 0.6, y: 0 },   // idle glances
      blink: on ? blink(t, { every: 2.8 }) : 0 });
  });
});
</script>
</body>
</html>
