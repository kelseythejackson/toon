<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A send button that launches — toon</title>
<link rel="stylesheet" href="../../src/toon.css">
<link rel="stylesheet" href="../demo.css">
<link rel="stylesheet" href="html.css">
</head>
<body>
<h1>A send button that launches</h1>
<p>The button pulls back, shoots forward, flies past its mark and settles there.</p>
<div class="panel">
<!-- @recipe -->
<div style="width:200px">
  <button class="toon-launch" style="--toon-distance:60px">
    Send</button>
</div>
<!-- @end -->
</div>
<p class="demo-try">Press <i>Send</i> to launch it again.</p>
<script src="../../src/toon.js"></script>
<script src="../demo-theme.js"></script>
<script src="../demo-runtime.js"></script>
<script>
ToonDemos.register('html/send', (document, Toon, DemoTheme) => {
// @recipe
const send = document.querySelector('.toon-launch');
send.onclick = () => {
  send.classList.remove('toon-launch');
  void send.offsetWidth;   // let the browser see the change
  send.classList.add('toon-launch');
};
// @end
});
</script>
</body>
</html>
