<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Follow-through in CSS — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
<style>
  /* Demo-only: a flat fill behind each card, like the cast. The snippet's cards keep their own outline. */
  .panel .toon-follow > li { background: color-mix(in srgb, var(--demo-primary) 16%, var(--demo-surface)); color: var(--demo-text); }
  .panel .toon-follow { flex: 1 1 100%; }
</style>
</head>
<body>
<h1>Follow-through in CSS</h1>
<p>Three cards slide in one after another. Each stops, swings past the stop from its top edge, then settles.</p>
<p class="demo-hint">Press Replay to run it again.</p>
<div class="panel">
<!-- @recipe -->
<ul class="toon-follow" style="--toon-overlap:70ms;
  list-style:none; margin:0; padding:0; display:grid; gap:8px">
  <li style="padding:12px 16px; border:2px solid;
    border-radius:10px">Pack the bag</li>
  <li style="padding:12px 16px; border:2px solid;
    border-radius:10px">Grab the keys</li>
  <li style="padding:12px 16px; border:2px solid;
    border-radius:10px">Lock the door</li>
</ul>
<button id="replay">Replay</button>
<!-- @end -->
</div>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('05-follow-through-css', (document, Toon, DemoTheme) => {
// @recipe
const list = document.querySelector('.toon-follow');
document.querySelector('#replay').onclick = () => {
  list.classList.remove('toon-follow');
  void list.offsetWidth;              // reflow, so the class
  list.classList.add('toon-follow');  // plays again
};
// @end
});
</script>
</body>
</html>
