<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Follow-through in Canvas — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
</head>
<body>
<h1>Follow-through in Canvas</h1>
<p>A ball darts from side to side on a <code>Spring</code>. Its two antennae are <code>Chain</code>s: they drag
  behind, swing past when the ball stops, then settle, each at its own pace.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:180px" role="img"
  aria-label="A ball slides from side to side and stops. Its
  two antennae trail behind, swing past the stop, then
  settle, one a little after the other"></canvas>
<!-- @end -->
</div>
<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('05-follow-through-canvas', (document, Toon, DemoTheme) => {
// @recipe
const { createStage, Spring, Chain } = Toon;
const stage = createStage(document.querySelector('canvas'));
const r = 22, cy = stage.height - 20 - r;  // radius, center
const x0 = stage.width * 0.3;      // where the ball starts
// Slightly under-damped: the body overshoots a little too.
const body = new Spring(x0, { stiffness: 90, damping: 11 });
// Two antennae with their own length and damping, so they
// don't swing in step (overlapping action). Negative gravity
// makes a chain stand up; stiffness keeps it from flopping.
const antennae = [[5, 0.93], [6, 0.97]].map(([n, damping]) =>
  new Chain(n, { x: x0, y: cy - r, length: 10, damping,
                 gravity: -3000, stiffness: 0.25 }));
let time = 0;

function step(dt) {
  time += dt;
  // Dart to the other side every 1.6 seconds, then hold.
  const right = Math.floor(time / 1.6) % 2 === 0;
  body.target = stage.width * (right ? 0.7 : 0.3);
  const x = body.step(dt);
  antennae.forEach((c, i) =>
    c.update({ x: x - 8 + i * 16, y: cy - r + 6 }, dt));
}
// Start as the ball stops, with the antennae swinging past.
for (let i = 0; i < 18; i++) step(1 / 60);
// @fold
// Reduced motion: freeze the clock on that frame.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Toon.ticker.timeScale = 0;
}
// @end-fold

stage.loop((dt) => {
  if (dt > 0) step(dt);
  const ctx = stage.ctx;
  // @fold
  // Colors from the page: --toon-color for fills, text for ink.
  const fill = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color').trim() || '#ff6b4a';
  const ink = getComputedStyle(document.body).color;
  // @end-fold
  stage.clear();
  ctx.fillStyle = ink; ctx.fillRect(0, cy + r, stage.width, 2);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = ink; ctx.lineWidth = 2.5;
  for (const c of antennae) {       // stalk, then a knob on top
    ctx.beginPath();
    c.points.forEach((p) => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    const tip = c.points[c.points.length - 1];
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(body.value, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
});
// @end
});
</script>
</body>
</html>
