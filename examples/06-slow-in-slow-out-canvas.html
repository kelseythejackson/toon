<!doctype html>
<html lang="en" data-style="saturday">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · Slow in &amp; slow out in Canvas — toon</title>
<link rel="stylesheet" href="../src/toon.css">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="recipes/recipe.css">
</head>
<body>
<h1>Slow in &amp; slow out in Canvas</h1>
<p>Two balls make the same trip, one with linear timing and one eased. The faint marks are a spacing chart: one mark per
  frame.</p>
<div class="panel">
<!-- @recipe -->
<canvas style="width:100%; height:180px" role="img"
  aria-label="Two balls slide back and forth. Marks under
  the top ball are evenly spaced; marks under the eased ball
  bunch up at both ends, where it moves slowly"></canvas>
<!-- @end -->
</div>
<script src="../src/toon.js"></script>
<script src="demo-theme.js"></script>
<script src="demo-runtime.js"></script>
<script>
ToonDemos.register('06-slow-in-slow-out-canvas', (document, Toon, DemoTheme) => {
// @recipe
const { createStage, tween, ease, lerp } = Toon;
const stage = createStage(document.querySelector('canvas'));
// One lane per easing. Each tween moves its ball from 0 to 1.
const lanes = [
  { label: 'ease.linear', ease: ease.linear, p: 0 },
  { label: 'ease.inOutCubic', ease: ease.inOutCubic, p: 0 },
];
for (const lane of lanes) {
  tween({ duration: 1200, ease: lane.ease, repeat: Infinity,
          yoyo: true, onUpdate: (v) => (lane.p = v) });
}
// @fold
// Reduced motion: freeze the clock. The marks still show
// where each ball is slow and where it is fast.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Toon.ticker.timeScale = 0;
}
// @end-fold

stage.loop(() => {
  const ctx = stage.ctx, x0 = 24, x1 = stage.width - 24;
  // @fold
  // Colors from the page: --toon-color for the ball, text for ink.
  const fill = getComputedStyle(document.documentElement)
    .getPropertyValue('--toon-color').trim() || '#ff6b4a';
  const ink = getComputedStyle(document.body).color;
  // @end-fold
  stage.clear();
  ctx.font = '12px ui-monospace, monospace';
  lanes.forEach((lane, i) => {
    const y = 64 + i * 80;
    ctx.fillStyle = ink; ctx.fillText(lane.label, x0, y - 30);
    // Spacing chart: where the ball is on each of 16 frames.
    ctx.globalAlpha = 0.45;
    for (let f = 0; f <= 16; f++) {
      const x = lerp(x0, x1, lane.ease(f / 16));
      ctx.fillRect(x - 1, y + 16, 2, 10);
    }
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(lerp(x0, x1, lane.p), y, 12, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.stroke();
  });
});
// @end
});
</script>
</body>
</html>
